  <script>
    document.addEventListener('DOMContentLoaded', function() {
      
      // Mobile Navigation Toggle
      const mobileNavToggle = document.getElementById('mobile-nav-toggle');
      const mainNav = document.getElementById('main-nav');
      const mobileNavOverlay = document.getElementById('mobile-nav-overlay');
      
      function toggleMobileNav() {
        const isOpen = mainNav.classList.contains('mobile-nav-open');
        
        if (isOpen) {
          // Close menu
          mainNav.classList.remove('mobile-nav-open');
          mobileNavOverlay.classList.remove('mobile-nav-open');
          mobileNavToggle.classList.remove('active');
          document.body.style.overflow = '';
        } else {
          // Open menu
          mainNav.classList.add('mobile-nav-open');
          mobileNavOverlay.classList.add('mobile-nav-open');
          mobileNavToggle.classList.add('active');
          document.body.style.overflow = 'hidden';
        }
      }
      
      // Toggle on button click
      mobileNavToggle.addEventListener('click', toggleMobileNav);
      
      // Close on overlay click
      mobileNavOverlay.addEventListener('click', toggleMobileNav);
      
      // Close on nav link click
      mainNav.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', () => {
          if (mainNav.classList.contains('mobile-nav-open')) {
            toggleMobileNav();
          }
        });
      });
      
      // Close on escape key
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && mainNav.classList.contains('mobile-nav-open')) {
          toggleMobileNav();
        }
      });
      
      // Automatic Dark Mode - Based on System Preferences
      const body = document.body;
      
      // Check system preference
      const prefersColorScheme = window.matchMedia('(prefers-color-scheme: dark)');
      
      // Apply dark mode if system prefers it
      if (prefersColorScheme.matches) {
        body.classList.add('dark-mode');
      }
      
      // Listen for changes in system preference
      prefersColorScheme.addEventListener('change', (e) => {
        if (e.matches) {
          body.classList.add('dark-mode');
        } else {
          body.classList.remove('dark-mode');
        }
      });
      
      // Featured project animations
      const setupFeaturedProjects = () => {
        const projects = document.querySelectorAll('.featured-project');
        
        // Intersection observer for scroll animations
        const projectObserver = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                const project = entry.target;
                const video = project.querySelector('.featured-project__video');
                
                // Trigger entrance animation
                project.classList.add('animate-in');
                
                // Start video playing when it comes into view
                if (video) {
                  video.play().catch(() => {});
                }
                
                // Stop observing this project
                projectObserver.unobserve(project);
              }
            });
          },
          { 
            threshold: 0.3,
            rootMargin: '0px 0px -20% 0px'
          }
        );
        
        // Observe all projects
        projects.forEach(project => {
          projectObserver.observe(project);
        });
      };
      
      // Initialize functionality
      setupFeaturedProjects();
      
      // Always show navigation immediately
      const header = document.querySelector('header');
      
      // Add scrolled class for styling after minimal scrolling
      window.addEventListener('scroll', () => {
        const currentScrollY = window.scrollY;
        
        if (currentScrollY > 50) {
          header.classList.add('scrolled');
        } else {
          header.classList.remove('scrolled');
        }
      });
      
      // Smooth scroll with dynamic header offset (only for same-page anchor links)
      document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener('click', function (e) {
          // Only handle same-page anchor links (not /#section links)
          const href = this.getAttribute('href');
          if (href.startsWith('/#')) {
            // Let the browser handle navigation to homepage with anchor
            return;
          }
          
          e.preventDefault();
          const targetId = href;
          const targetElement = document.querySelector(targetId);
          if (targetElement) {
            const headerHeight = header.classList.contains('scrolled') ? 60 : 80; // Use consistent header height
            const targetPosition = targetElement.offsetTop - headerHeight;
            window.scrollTo({
              top: targetPosition,
              behavior: 'smooth'
            });
          }
        });
      });
      
      // Lazy loading for index cards - show 25 initially, load 25 more at a time
      const loadMoreBtn = document.getElementById('load-more');
      const indexGrid = document.getElementById('index-grid');
      let itemsShown = 25; // Start with 25 items shown
      
      if (loadMoreBtn) {
        loadMoreBtn.addEventListener('click', function() {
          const hiddenItems = indexGrid.querySelectorAll('.index-card[data-index]:nth-child(n+' + (itemsShown + 1) + ')');
          const itemsToShow = Array.from(hiddenItems).slice(0, 25); // Load 25 more at a time
          
          itemsToShow.forEach(item => {
            item.style.display = 'block';
          });
          
          itemsShown += itemsToShow.length;
          
          if (itemsToShow.length < 25) {
            loadMoreBtn.style.display = 'none';
          }
        });
        
        // Hide button if no more items to show
        const totalItems = indexGrid.querySelectorAll('.index-card').length;
        if (totalItems <= 25) { // Updated threshold
          loadMoreBtn.style.display = 'none';
        }
      }
    });
  </script>
